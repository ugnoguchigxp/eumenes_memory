name: verify

on:
  push:
    branches: [main, "codex/quality-80"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build:host
      - run: bun run verify:all
      - run: bun run verify:package
      - run: bun run verify:host
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-report-${{ matrix.os }}
          path: |
            verification-reports/latest.json
            verification-reports/quality-80/package.json
            verification-reports/host/package.json
